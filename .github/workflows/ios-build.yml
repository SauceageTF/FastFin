name: iOS Build

# Builds an unsigned .ipa on a real macOS runner and hands it back as a
# workflow artifact. Deliberately unsigned -- AltStore/Sideloadly do the
# actual code-signing themselves (with your free Apple ID) at install time,
# so there's nothing here that needs a paid Apple Developer account or any
# signing secrets in this repo.

on:
  push:
    branches: [master]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -n "$latest" ]; then sudo xcode-select -switch "$latest"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project FastFin.xcodeproj -scheme FastFin

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project FastFin.xcodeproj \
            -scheme FastFin \
            -archivePath build/FastFin.xcarchive \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          set -e
          APP_PATH="build/FastFin.xcarchive/Products/Applications/FastFin.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::No .app produced at $APP_PATH -- check the build step's log above."
            exit 1
          fi
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -qr FastFin.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: FastFin-ipa
          path: ios/build/FastFin.ipa
          retention-days: 30
